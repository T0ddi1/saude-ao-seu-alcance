<header class="header">
  <div class="header__bar">
    <a class="header__logo" routerLink="/" (click)="onLogoTap()" aria-label="Saúde ao Seu Alcance — página inicial"></a>

    <nav class="header__nav">
      <div class="header__nav-item" *ngFor="let item of navItems(); let i = index">
        <button
          type="button"
          class="header__nav-trigger"
          (click)="toggleMenu(i, $event)"
          [class.is-open]="openIndex() === i"
          [attr.aria-expanded]="openIndex() === i"
        >
          {{ item.label }}
          <app-icon name="chevron-down" [size]="14"></app-icon>
        </button>

        <div class="header__mega" *ngIf="openIndex() === i && item.columns?.length">
          <div class="header__mega-col" *ngFor="let col of item.columns">
            <h4>{{ col.title }}</h4>
            <ng-container *ngFor="let link of col.items">
              <a *ngIf="!anchorNav.isAnchorLink(link.href)" [routerLink]="link.href">{{ link.label }}</a>
              <a *ngIf="anchorNav.isAnchorLink(link.href)" [href]="link.href" (click)="anchorNav.navigate(link.href, $event)">{{ link.label }}</a>
            </ng-container>
          </div>
        </div>
      </div>
    </nav>

    <div class="header__actions">
      <app-search-box></app-search-box>
<!--      <button type="button" class="header__icon-btn" aria-label="Favoritos">-->
<!--        <app-icon name="bookmark" [size]="18"></app-icon>-->
<!--      </button>-->
<!--      <a class="header__login" routerLink="/cadastre-se">-->
<!--        <app-icon name="user" [size]="16"></app-icon>-->
<!--        Entrar-->
<!--      </a>-->
      <a class="header__contact" routerLink="/contato">Contato</a>
    </div>

    <button
      type="button"
      class="header__exit-fullscreen"
      *ngIf="totem.isTotem() && totem.isFullscreen()"
      (click)="totem.exitFullscreen()"
      aria-label="Sair da tela cheia"
    >
      <app-icon name="compress" [size]="16" color="#fff"></app-icon>
    </button>

    <button
      type="button"
      class="header__burger"
      (click)="toggleMobileMenu()"
      [class.is-open]="mobileMenuOpen()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="Abrir menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div class="header__mobile-panel" *ngIf="mobileMenuOpen()">
    <app-search-box variant="mobile" class="header__search--mobile"></app-search-box>

    <div class="header__mobile-nav-item" *ngFor="let item of navItems(); let i = index">
      <button
        type="button"
        class="header__mobile-nav-trigger"
        (click)="toggleMenu(i, $event)"
        [class.is-open]="openIndex() === i"
        [attr.aria-expanded]="openIndex() === i"
      >
        {{ item.label }}
        <app-icon name="chevron-down" [size]="14"></app-icon>
      </button>

      <div class="header__mobile-submenu" *ngIf="openIndex() === i && item.columns?.length">
        <div class="header__mega-col" *ngFor="let col of item.columns">
          <h4>{{ col.title }}</h4>
          <ng-container *ngFor="let link of col.items">
            <a *ngIf="!anchorNav.isAnchorLink(link.href)" [routerLink]="link.href" (click)="closeMobileMenu()">{{ link.label }}</a>
            <a
              *ngIf="anchorNav.isAnchorLink(link.href)"
              [href]="link.href"
              (click)="anchorNav.navigate(link.href, $event); closeMobileMenu()"
            >{{ link.label }}</a>
          </ng-container>
        </div>
      </div>
    </div>

    <div class="header__mobile-actions">
        <!--      <a class="header__login" *ngIf="!totem.isTotem()" routerLink="/cadastre-se" (click)="closeMobileMenu()">
               <app-icon name="user" [size]="16"></app-icon>
               Entrar
             </a>-->
        <a class="header__contact" routerLink="/contato" (click)="closeMobileMenu()">Contato</a>
    </div>
  </div>
</header>
