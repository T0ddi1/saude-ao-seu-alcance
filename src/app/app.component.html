<a class="skip-link" href="javascript:void(0)" (click)="irParaConteudo($event)">Pular para o conteúdo</a>
<app-header *ngIf="!isAdmin()"></app-header>
<main id="conteudo" tabindex="-1" [class.main--admin]="isAdmin()">
  <router-outlet></router-outlet>
</main>
<app-footer *ngIf="!isAdmin()"></app-footer>
<app-toast></app-toast>
<app-aviso-popup *ngIf="!isAdmin()"></app-aviso-popup>

<nav class="totem-nav" *ngIf="totem.isTotem() && !totem.menuOpen()" aria-label="Navegação do totem">
  <button type="button" class="totem-nav__btn" *ngIf="!isHome()" (click)="goBack()" aria-label="Voltar">
    <span aria-hidden="true">←</span> Voltar
  </button>
  <button type="button" class="totem-nav__btn totem-nav__btn--destaque" *ngIf="!isHome()" (click)="goHome()" aria-label="Ir para o início">
    <span aria-hidden="true">⌂</span> Início
  </button>
  <button type="button" class="totem-nav__btn" *ngIf="!totem.isFullscreen()" (click)="totem.goFullscreen()">
    Tela cheia
  </button>
</nav>
