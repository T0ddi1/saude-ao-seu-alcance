<a class="skip-link" href="javascript:void(0)" (click)="irParaConteudo($event)">Pular para o conteúdo</a>
<app-header *ngIf="!isAdmin()"></app-header>
<main id="conteudo" tabindex="-1" [class.main--admin]="isAdmin()">
  <router-outlet></router-outlet>
</main>
<app-footer *ngIf="!isAdmin()"></app-footer>
<app-toast></app-toast>

<button
  type="button"
  class="fullscreen-btn"
  *ngIf="totem.isTotem() && !totem.isFullscreen()"
  (click)="totem.goFullscreen()"
>
  Tocar para tela cheia
</button>

<button
  type="button"
  class="back-btn"
  *ngIf="totem.isTotem() && !isHome() && !totem.menuOpen()"
  (click)="goBack()"
  aria-label="Voltar"
>
  ← Voltar
</button>
