<app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>

<div class="auth">
  <div class="auth__card">
    <h1>Entrar</h1>
    <p class="auth__subtitle">Entre com os seus dados abaixo:</p>

    <form class="auth__form" (ngSubmit)="onSubmit()">
      <label class="auth__field">
        <input type="email" name="email" [(ngModel)]="email" placeholder="Digite o seu e-mail" aria-label="E-mail" autocomplete="email" required />
      </label>

      <label class="auth__field auth__field--password">
        <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="Senha" aria-label="Senha" autocomplete="current-password" required />
        <button type="button" class="auth__toggle" (click)="togglePassword()" [attr.aria-pressed]="showPassword" aria-label="Mostrar senha">
          {{ showPassword ? 'ocultar' : 'ver' }}
        </button>
      </label>

      <p class="auth__error" *ngIf="error()">{{ error() }}</p>

      <app-button type="submit" variant="primary">{{ submitting() ? 'Entrando…' : 'Entrar' }}</app-button>
    </form>

    <p class="auth__footnote">Não tem uma conta? <a routerLink="/criar-conta">Criar uma conta.</a></p>
  </div>
</div>
