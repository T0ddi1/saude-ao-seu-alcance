<section class="comments">
  <h3>Deixe um comentário</h3>
  <p class="comments__note">Seu endereço de e-mail não será publicado. Os campos obrigatórios estão marcados com *</p>

  <form class="comments__form" (ngSubmit)="onSubmit()">
    <div class="comments__row">
      <label>
        Nome *
        <input type="text" name="name" [(ngModel)]="name" required />
      </label>
      <label>
        Seu E-mail *
        <input type="email" name="email" [(ngModel)]="email" required />
      </label>
    </div>

    <label class="comments__message">
      Mensagem *
      <textarea name="message" rows="6" [(ngModel)]="message" placeholder="Digite sua mensagem aqui." required></textarea>
    </label>

    <label class="comments__checkbox">
      <input type="checkbox" name="saveInfo" [(ngModel)]="saveInfo" />
      Salve meu nome, e-mail e site neste navegador para a próxima vez que eu comentar.
    </label>

    <app-button type="submit" variant="primary">Postar Comentário →</app-button>
    <p class="comments__thanks" *ngIf="posted()">Comentário publicado — obrigado por participar!</p>
  </form>

  <h3 class="comments__heading">Comentários</h3>
  <article class="comments__item" *ngFor="let comment of comments">
    <div class="comments__avatar" aria-hidden="true"></div>
    <div class="comments__body">
      <header>
        <strong>{{ comment.name }}</strong>
        <span>{{ comment.date }}</span>
      </header>
      <p>{{ comment.text }}</p>
      <button type="button" class="comments__reply">Responder</button>
    </div>
  </article>
</section>
