<section
  class="hero"
  [style.--hero-image]="article().image ? 'url(' + article().image + ')' : 'none'"
  (mouseenter)="pauseAutoplay()"
  (mouseleave)="resumeAutoplay()"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  <div class="hero__text">
    <p class="hero__eyebrow">{{ article().eyebrow }}</p>
    <a class="hero__link" [routerLink]="article().href">
      <h1 class="hero__title">{{ article().title }}</h1>
      <p class="hero__excerpt">{{ article().excerpt }}</p>
    </a>
    <div class="hero__row">
      <app-button variant="primary" [href]="article().href" [showArrow]="true">{{ article().ctaLabel }}</app-button>

      <div class="hero__dots" *ngIf="articles.length > 1">
        <button
          type="button"
          class="hero__dot"
          *ngFor="let a of articles; let i = index"
          [class.is-active]="i === activeIndex()"
          [attr.aria-current]="i === activeIndex()"
          [attr.aria-label]="'Ir para o slide ' + (i + 1)"
          (click)="goTo(i)"
        ></button>
      </div>
    </div>
  </div>

  <div class="hero__media" [class.hero__media--vazio]="!temImagem()" aria-hidden="true">
    <ng-container *ngFor="let a of articles; let i = index">
      <img
        *ngIf="a.image"
        class="hero__slide"
        [class.is-active]="i === activeIndex()"
        [src]="a.image"
        alt=""
        [attr.loading]="i === 0 ? 'eager' : 'lazy'"
      />
    </ng-container>
  </div>
</section>
