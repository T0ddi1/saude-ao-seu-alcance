<app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>

<div class="contact">
  <div class="contact__intro">
    <h1>Fale com a gente</h1>
    <p>Dúvidas, sugestões de pauta ou parcerias — preencha o formulário abaixo e nossa equipe responde em breve.</p>
  </div>

  <div class="contact__form-wrap">
    <iframe
      [src]="formUrl"
      width="640"
      height="858"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      title="Formulário de contato"
    >Carregando…</iframe>
  </div>
</div>
